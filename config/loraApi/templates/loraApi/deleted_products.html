<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lora | Deleted products</title>
  <style>
    :root { --ink:#182326; --muted:#6d7b7d; --line:#dbe3df; --paper:#f5f7f4; --white:#fff; --teal:#087f78; --teal-dark:#075d5a; --coral:#d95f4d; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 90% 0, #dceee7 0, transparent 34%), linear-gradient(135deg, #f8faf7 0, #edf3ef 100%); font-family:Georgia, 'Times New Roman', serif; }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; max-width:980px; margin:auto; padding:42px 28px 30px; }
    .eyebrow { margin:0 0 8px; color:var(--teal); font:700 12px/1.2 Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; }
    h1 { margin:0; font-size:42px; line-height:1; font-weight:500; }
    nav { display:flex; gap:18px; flex-wrap:wrap; }
    a { color:var(--teal-dark); font:700 12px Arial,sans-serif; letter-spacing:1px; text-decoration:none; text-transform:uppercase; }
    a:hover { color:var(--coral); }
    main { max-width:980px; margin:auto; padding:0 28px 54px; }
    .panel { padding:26px; background:var(--white); border:1px solid var(--line); box-shadow:0 12px 35px rgba(28,62,54,.06); }
    .toolbar { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:18px; }
    .toolbar p { margin:0; color:var(--muted); font:14px/1.5 Arial,sans-serif; }
    label { display:grid; gap:7px; min-width:min(100%, 300px); color:#435153; font:700 11px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
    input { width:100%; height:44px; padding:11px 13px; color:var(--ink); background:#fbfcfa; border:1px solid #cbd7d2; border-radius:2px; font:16px Georgia,serif; }
    input:focus { border-color:var(--teal); outline:3px solid #d9efeb; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); }
    table { width:100%; min-width:680px; border-collapse:collapse; }
    th { padding:11px 13px; color:var(--muted); border-bottom:1px solid var(--line); text-align:left; font:700 10px Arial,sans-serif; letter-spacing:.8px; text-transform:uppercase; }
    td { padding:13px; border-bottom:1px solid var(--line); font:14px Arial,sans-serif; }
    tr:last-child td { border-bottom:0; }
    .empty { padding:24px 13px; color:var(--muted); font:14px Arial,sans-serif; }
    .error { color:#a53b2e; }
    @media (max-width:650px) { header { display:block; padding:28px 16px 24px; } nav { margin-top:20px; } main { padding:0 16px 36px; } .panel { padding:18px; } .toolbar { display:grid; } }
  </style>
</head>
<body>
  <header>
    <div><p class="eyebrow">Lora operations</p><h1>Deleted products</h1></div>
    <nav><a href="/stock/">Main stock</a><a href="/">Sale control</a></nav>
  </header>
  <main>
    <section class="panel" aria-label="Deleted product history">
      <div class="toolbar">
        <p id="status" role="status">Loading deletion history...</p>
        <label>Search history<input id="search" type="search" placeholder="Product, branch, or user" autocomplete="off"></label>
      </div>
      <div class="table-wrap" id="history"><p class="empty">Loading deletion history...</p></div>
    </section>
  </main>
  <script>
    const historyElement = document.querySelector('#history');
    const searchInput = document.querySelector('#search');
    const statusElement = document.querySelector('#status');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    let deletedProducts = [];
    function renderHistory() {
      const query = searchInput.value.trim().toLowerCase();
      const products = deletedProducts.filter(product => [product.product_name, product.product_id, product.branch, product.deleted_by].some(value => String(value ?? '').toLowerCase().includes(query)));
      historyElement.innerHTML = products.length
        ? `<table><thead><tr><th>Product</th><th>Product ID</th><th>Branch</th><th>Deleted by</th><th>Deleted at</th></tr></thead><tbody>${products.map(product => `<tr><td>${escapeHtml(product.product_name)}</td><td>${escapeHtml(product.product_id)}</td><td>${escapeHtml(product.branch)}</td><td>${escapeHtml(product.deleted_by)}</td><td>${escapeHtml(new Date(product.deleted_at).toLocaleString())}</td></tr>`).join('')}</tbody></table>`
        : `<p class="empty">${query ? 'No deleted products match your search.' : 'No completed product deletions yet.'}</p>`;
    }
    searchInput.addEventListener('input', renderHistory);
    fetch('/api/products/deleted/', { cache: 'no-store' })
      .then(async response => {
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'Deletion history could not be loaded.');
        deletedProducts = data.products || [];
        statusElement.textContent = `${deletedProducts.length} completed deletion${deletedProducts.length === 1 ? '' : 's'}`;
        renderHistory();
      })
      .catch(error => {
        statusElement.textContent = error.message;
        statusElement.className = 'error';
        historyElement.innerHTML = '<p class="empty error">Deletion history is unavailable. Refresh the page to try again.</p>';
      });
  </script>
</body>
</html>
